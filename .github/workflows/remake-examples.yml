# Temporary: remakes examples/example_output with examples/demo_end_to_end.py and commits the
# result to this branch. Removed again before the branch is merged.
name: Remake example outputs

on:
  push:
    branches: ["claude/remove-personal-names"]
    paths: [".github/workflows/remake-examples.yml"]

permissions:
  contents: write

jobs:
  remake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install requirements and ElectroTag
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Run the demonstration and save the examples
        run: python examples/demo_end_to_end.py "$RUNNER_TEMP/demo" --save-examples
      - name: Commit the new example outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A examples/example_output
          git commit -m "Remake the example outputs with annotator A04"
          git push
